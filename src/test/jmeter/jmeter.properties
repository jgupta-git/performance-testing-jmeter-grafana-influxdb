# JMeter Configuration for InfluxDB Integration

# HTTP Client Configuration
httpclient.timeout=60000
httpclient.socket.timeout=60000
httpclient.connection.timeout=60000

# Reporting Configuration
jmeter.save.saveservice.output_format=json
jmeter.save.saveservice.response_data=true
jmeter.save.saveservice.response_headers=true
jmeter.save.saveservice.request_headers=true
jmeter.save.saveservice.assertion_results_failure_message=true

# Backend Listener Configuration for InfluxDB
backend_listener_classname=org.apache.jmeter.visualizers.backend.influxdb.HttpMetricsSender

# InfluxDB Connection Settings (can be overridden via command line)
# influxdbUrl=https://us-east-1-1.aws.cloud2.influxdata.com
# influxdbToken=your-api-token-here
# influxdbOrganization=your-org-id
# influxdbBucket=jmeter-metrics

# Test Results Directory
jmeterengine.force.system.exit=false
jmeterengine.stopfail=false

# Thread Configuration
threads.behave.all.same.seed=false
log_level.jmeter=INFO
log_level.jmeter.junit=INFO
